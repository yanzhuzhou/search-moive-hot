name: 每日票房数据更新

on:
  schedule:
    # 每日 16:00 UTC（北京时间次日 00:00）抓取，记录当日完整累计票房
    - cron: "0 16 * * *"
  workflow_dispatch:        # 允许在 Actions 页面手动触发
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/daily.yml"

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r scripts/requirements.txt

      - name: 创建 data 目录          # ← 新增
        run: mkdir -p data            # ← 新增

      - name: 运行爬虫
        env:
          MY_COOKIE: ${{ secrets.MY_COOKIE }}   # 可选：猫眼专业版 Cookie，解锁省份明细
          TOP_N: "30"
        run: python scripts/crawler.py

      - name: 构建自包含页面
        run: python scripts/build_index.py

      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新票房数据 $(date +%F)"
            git push
          fi
